name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: true
  PYTHONUNBUFFERED: true
  FRA_LOCAL_SMOKE_TEST: 0
  FRA_OPENAI_SMOKE_TEST: 0

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
      tests: ${{ steps.filter.outputs.tests }}
      workflows: ${{ steps.filter.outputs.workflows }}
      config: ${{ steps.filter.outputs.config }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed areas
        id: filter
        run: |
          {
            echo "source=true"
            echo "tests=true"
            echo "workflows=true"
            echo "config=true"
            echo "docs=true"
          } >> "$GITHUB_OUTPUT"

  format:
    name: Format
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.source == 'true' ||
        needs.changes.outputs.tests == 'true' ||
        needs.changes.outputs.workflows == 'true' ||
        needs.changes.outputs.config == 'true'
      }}
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify formatting
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff format --check .

  lint:
    name: Lint
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.source == 'true' ||
        needs.changes.outputs.tests == 'true' ||
        needs.changes.outputs.workflows == 'true' ||
        needs.changes.outputs.config == 'true'
      }}
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Ruff
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check .

  test:
    name: Test
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.source == 'true' ||
        needs.changes.outputs.tests == 'true' ||
        needs.changes.outputs.workflows == 'true' ||
        needs.changes.outputs.config == 'true'
      }}
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest

  compile:
    name: Compile
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.source == 'true' ||
        needs.changes.outputs.tests == 'true' ||
        needs.changes.outputs.workflows == 'true' ||
        needs.changes.outputs.config == 'true'
      }}
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile source and tests
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests

  health:
    name: Health CLI
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.source == 'true' ||
        needs.changes.outputs.tests == 'true' ||
        needs.changes.outputs.workflows == 'true' ||
        needs.changes.outputs.config == 'true'
      }}
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run health check
        run: |
          python -m pip install -e ".[dev]"
          python -m financial_research_agent --pretty

  package:
    name: Package
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.source == 'true' ||
        needs.changes.outputs.tests == 'true' ||
        needs.changes.outputs.workflows == 'true' ||
        needs.changes.outputs.config == 'true'
      }}
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and smoke-test wheel
        run: |
          python -m pip install -e ".[dev]"
          python -m build
          python -m venv /tmp/fra-wheel
          /tmp/fra-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/fra-wheel/bin/financial-research-agent --pretty
          /tmp/fra-wheel/bin/python -c "from importlib.resources import files; assert files('financial_research_agent.web').joinpath('static/index.html').is_file(); assert files('financial_research_agent.persistence.migrations').joinpath('0001_initial.sql').is_file(); assert files('financial_research_agent.report_exports').joinpath('assets/NotoSans-Regular.ttf').is_file()"

  diff:
    name: Diff check
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.source == 'true' ||
        needs.changes.outputs.tests == 'true' ||
        needs.changes.outputs.workflows == 'true' ||
        needs.changes.outputs.config == 'true' ||
        needs.changes.outputs.docs == 'true'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace errors
        run: |
          apt-get update && apt-get install -y git
          git diff --check

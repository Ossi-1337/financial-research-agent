name: financial-research-agent

x-app-image: &app-image
  image: financial-research-agent-app:local
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime

x-runtime-environment: &runtime-environment
  FRA_ENV: ${FRA_ENV:-local}
  FRA_HOME: /data
  FRA_STORAGE_PROVIDER: ${FRA_STORAGE_PROVIDER:-sqlite}
  FRA_RETRIEVAL_PROVIDER: ${FRA_RETRIEVAL_PROVIDER:-local-vector}
  FRA_LLM_PROVIDER: ${FRA_LLM_PROVIDER:-offline-test}
  FRA_LLM_MODEL: ${FRA_LLM_MODEL:-offline-test}
  FRA_LLM_BASE_URL: ${FRA_LLM_BASE_URL:-http://llama-cpp:8080/v1}
  FRA_LLM_LOCAL_RUNTIME: ${FRA_LLM_LOCAL_RUNTIME:-llama.cpp}
  FRA_LLM_TIMEOUT_SECONDS: ${FRA_LLM_TIMEOUT_SECONDS:-90}
  FRA_EMBEDDING_PROVIDER: ${FRA_EMBEDDING_PROVIDER:-disabled}
  FRA_EMBEDDING_MODEL: ${FRA_EMBEDDING_MODEL:-}
  FRA_OPENAI_API_KEY: ${FRA_OPENAI_API_KEY:-}
  FRA_ANTHROPIC_API_KEY: ${FRA_ANTHROPIC_API_KEY:-}
  FRA_GEMINI_API_KEY: ${FRA_GEMINI_API_KEY:-}
  FRA_LITELLM_API_KEY: ${FRA_LITELLM_API_KEY:-}
  FRA_PROMPT_BUDGET_INPUT_TOKENS: ${FRA_PROMPT_BUDGET_INPUT_TOKENS:-16000}
  FRA_PROMPT_BUDGET_OUTPUT_TOKENS: ${FRA_PROMPT_BUDGET_OUTPUT_TOKENS:-1024}
  FRA_AGENT_MAX_OUTPUT_TOKENS: ${FRA_AGENT_MAX_OUTPUT_TOKENS:-2048}
  FRA_ALPHA_VANTAGE_API_KEY: ${FRA_ALPHA_VANTAGE_API_KEY:-}
  FRA_SEC_USER_AGENT: ${FRA_SEC_USER_AGENT:-financial-research-agent/0.1 local-research contact@financial-research-agent.local}
  FRA_ALLOW_REMOTE_BIND: "true"

x-web-environment: &web-environment
  FRA_WEB_RESEARCH_ENABLED: ${FRA_WEB_RESEARCH_ENABLED:-false}
  FRA_WEB_SEARCH_PROVIDER: ${FRA_WEB_SEARCH_PROVIDER:-brave}
  FRA_BRAVE_SEARCH_API_KEY: ${FRA_BRAVE_SEARCH_API_KEY:-}
  FRA_TAVILY_API_KEY: ${FRA_TAVILY_API_KEY:-}
  FRA_TAVILY_BASE_URL: ${FRA_TAVILY_BASE_URL:-https://api.tavily.com}
  FRA_SEARXNG_BASE_URL: ${FRA_SEARXNG_BASE_URL:-http://searxng:8080}
  FRA_WEB_SEARCH_TIMEOUT_SECONDS: ${FRA_WEB_SEARCH_TIMEOUT_SECONDS:-15}
  FRA_WEB_SEARCH_MAX_RESULTS: ${FRA_WEB_SEARCH_MAX_RESULTS:-8}
  FRA_WEB_FETCH_MAX_SOURCES: ${FRA_WEB_FETCH_MAX_SOURCES:-5}
  FRA_WEB_FETCH_MAX_BYTES: ${FRA_WEB_FETCH_MAX_BYTES:-2000000}
  FRA_WEB_NEWS_CACHE_TTL_MINUTES: ${FRA_WEB_NEWS_CACHE_TTL_MINUTES:-60}
  FRA_WEB_REGULATORY_CACHE_TTL_HOURS: ${FRA_WEB_REGULATORY_CACHE_TTL_HOURS:-24}
  FRA_WEB_LIVE_SMOKE_TEST: ${FRA_WEB_LIVE_SMOKE_TEST:-0}

x-a2a-service: &a2a-service
  <<: *app-image
  depends_on:
    data-init:
      condition: service_completed_successfully
  volumes:
    - fra-data:/data
  restart: unless-stopped

services:
  data-init:
    <<: *app-image
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /data"]
    volumes:
      - fra-data:/data
    restart: "no"

  app:
    <<: *app-image
    depends_on:
      data-init:
        condition: service_completed_successfully
      financial-report-agent:
        condition: service_healthy
      stock-agent:
        condition: service_healthy
      context-agent:
        condition: service_healthy
      synthesis-agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRA_APP_PORT:-8000}:8000"
    environment:
      <<: [*runtime-environment, *web-environment]
      FRA_A2A_FINANCIAL_REPORT_URL: http://financial-report-agent:8002
      FRA_A2A_STOCK_URL: http://stock-agent:8003
      FRA_A2A_CONTEXT_URL: http://context-agent:8004
      FRA_A2A_SYNTHESIS_URL: http://synthesis-agent:8005
      FRA_A2A_DELEGATION_TIMEOUT_SECONDS: ${FRA_A2A_DELEGATION_TIMEOUT_SECONDS:-120}
      FRA_A2A_DELEGATION_MAX_ATTEMPTS: ${FRA_A2A_DELEGATION_MAX_ATTEMPTS:-2}
      FRA_BACKGROUND_MAX_CONCURRENT_RESEARCH_RUNS: ${FRA_BACKGROUND_MAX_CONCURRENT_RESEARCH_RUNS:-1}
    volumes:
      - fra-data:/data
    restart: unless-stopped

  financial-report-agent:
    <<: *a2a-service
    command: [financial-research-agent, a2a-serve, --role, financial-report, --host, 0.0.0.0, --port, "8002"]
    expose: ["8002"]
    environment:
      <<: *runtime-environment
      FRA_A2A_ENABLED: "true"
      FRA_A2A_LOCAL_ONLY: "true"
      FRA_A2A_PORT: "8002"
      FRA_A2A_PUBLIC_BASE_URL: http://financial-report-agent:8002
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/.well-known/agent-card.json', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  stock-agent:
    <<: *a2a-service
    command: [financial-research-agent, a2a-serve, --role, stock, --host, 0.0.0.0, --port, "8003"]
    expose: ["8003"]
    environment:
      <<: *runtime-environment
      FRA_A2A_ENABLED: "true"
      FRA_A2A_LOCAL_ONLY: "true"
      FRA_A2A_PORT: "8003"
      FRA_A2A_PUBLIC_BASE_URL: http://stock-agent:8003
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/.well-known/agent-card.json', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  context-agent:
    <<: *a2a-service
    command: [financial-research-agent, a2a-serve, --role, context, --host, 0.0.0.0, --port, "8004"]
    expose: ["8004"]
    environment:
      <<: [*runtime-environment, *web-environment]
      FRA_A2A_ENABLED: "true"
      FRA_A2A_LOCAL_ONLY: "true"
      FRA_A2A_PORT: "8004"
      FRA_A2A_PUBLIC_BASE_URL: http://context-agent:8004
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/.well-known/agent-card.json', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  searxng:
    image: ${FRA_SEARXNG_IMAGE:-docker.io/searxng/searxng:latest}
    profiles: [searxng]
    ports:
      - "127.0.0.1:${FRA_SEARXNG_PORT:-8888}:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:${FRA_SEARXNG_PORT:-8888}/
      SEARXNG_SECRET: ${FRA_SEARXNG_SECRET:-local-only-searxng-instance}
      SEARXNG_LIMITER: "false"
      SEARXNG_IMAGE_PROXY: "false"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  synthesis-agent:
    <<: *a2a-service
    command: [financial-research-agent, a2a-serve, --role, synthesis, --host, 0.0.0.0, --port, "8005"]
    expose: ["8005"]
    environment:
      <<: *runtime-environment
      FRA_A2A_ENABLED: "true"
      FRA_A2A_LOCAL_ONLY: "true"
      FRA_A2A_PORT: "8005"
      FRA_A2A_PUBLIC_BASE_URL: http://synthesis-agent:8005
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/.well-known/agent-card.json', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  llama-cpp-cpu:
    image: ${FRA_LLAMA_CPP_CPU_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    profiles: [cpu]
    ports:
      - "127.0.0.1:${FRA_LLAMA_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${FRA_HUGGINGFACE_CACHE:-./.docker/huggingface}
        target: /root/.cache/huggingface
    command:
      - -hf
      - ${FRA_CPU_MODEL:-ggml-org/gemma-3-1b-it-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${FRA_CPU_CTX_SIZE:-8192}
      - --jinja
      - -ngl
      - "0"
    networks:
      default:
        aliases: [llama-cpp]

  llama-cpp-cuda:
    image: ${FRA_LLAMA_CPP_CUDA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    profiles: [cuda]
    gpus: all
    ports:
      - "127.0.0.1:${FRA_LLAMA_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${FRA_HUGGINGFACE_CACHE:-./.docker/huggingface}
        target: /root/.cache/huggingface
    command:
      - -hf
      - ${FRA_CUDA_MODEL:-unsloth/Mistral-Small-3.2-24B-Instruct-2506-GGUF:UD-Q4_K_XL}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${FRA_CUDA_CTX_SIZE:-32768}
      - --jinja
      - -ngl
      - ${FRA_LLAMA_GPU_LAYERS:-99}
    networks:
      default:
        aliases: [llama-cpp]

volumes:
  fra-data:

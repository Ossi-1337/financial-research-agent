<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Financial Research Agent</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Financial Research Agent</h1>
          <p id="session-label" class="muted">Starting session</p>
        </div>
        <div id="provider-pill" class="provider-pill">offline-test</div>
      </header>

      <div class="workspace">
        <aside class="session-panel" aria-label="Chat sessions">
          <div class="session-actions">
            <button id="new-session-button" type="button">New</button>
            <button id="clear-sessions-button" class="secondary-button" type="button">Clear</button>
          </div>
          <ol id="session-list" class="session-list"></ol>
          <section class="company-lookup" aria-label="Company lookup">
            <form id="company-search-form" class="company-search-form">
              <label for="company-search-input">Company</label>
              <div class="company-search-row">
                <input
                  id="company-search-input"
                  name="company"
                  maxlength="200"
                  placeholder="Novo Nordisk"
                  required
                />
                <button id="company-search-button" type="submit">Find</button>
              </div>
            </form>
            <div id="company-search-status" class="lookup-status" aria-live="polite"></div>
            <ol id="company-results" class="company-results"></ol>
            <div id="selected-company" class="selected-company" hidden></div>
            <div id="market-data-status" class="lookup-status" aria-live="polite"></div>
            <div id="market-data-summary" class="market-data-summary" hidden></div>
            <div id="financial-statements-status" class="lookup-status" aria-live="polite"></div>
            <div id="financial-statements-summary" class="financial-statements-summary" hidden></div>
            <div id="filings-status" class="lookup-status" aria-live="polite"></div>
            <div id="filings-summary" class="filings-summary" hidden></div>
          </section>
        </aside>

        <section class="chat-panel" aria-label="Chat">
          <div id="error-banner" class="error-banner" role="alert" hidden></div>
          <ol id="message-list" class="message-list"></ol>
          <div id="loading-row" class="loading-row" hidden>Thinking...</div>
          <form id="chat-form" class="composer">
            <label class="sr-only" for="message-input">Message</label>
            <textarea
              id="message-input"
              name="message"
              rows="3"
              maxlength="20000"
              placeholder="Ask a follow-up or start a company research question"
              required
            ></textarea>
            <button id="send-button" type="submit">Send</button>
          </form>
        </section>
      </div>
    </main>
    <script src="/static/app.js" type="module"></script>
  </body>
</html>

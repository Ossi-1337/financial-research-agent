<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Financial Research Agent</title>
    <link rel="stylesheet" href="/static/styles.css?v=50" />
  </head>
  <body>
    <main class="app-shell">
      <div class="workspace">
        <aside class="session-panel" aria-label="Chat sessions">
          <div class="session-actions">
            <button id="new-session-button" type="button">New</button>
            <button id="clear-sessions-button" class="secondary-button" type="button">Clear</button>
          </div>
          <ol id="session-list" class="session-list"></ol>
          <div class="session-footer">
            <button id="settings-button" class="secondary-button" type="button">Settings</button>
          </div>
        </aside>

        <section class="chat-panel" aria-label="Chat">
          <div id="error-banner" class="error-banner" role="alert" hidden></div>
          <ol id="message-list" class="message-list"></ol>
          <section id="context-panel" class="context-panel" aria-label="Current context" hidden>
            <div class="context-panel-header">
              <h2>Current context</h2>
            </div>
            <ol id="context-source-list" class="context-source-list"></ol>
          </section>
          <form id="chat-form" class="composer">
            <label class="sr-only" for="message-input">Message</label>
            <div class="composer-shell">
              <div
                id="message-input"
                class="message-input"
                role="textbox"
                aria-multiline="true"
                contenteditable="true"
                data-placeholder="Ask a follow-up or start a company research question"
              ></div>
              <ol
                id="mention-menu"
                class="mention-menu"
                aria-label="Company mention suggestions"
                hidden
              ></ol>
              <div class="composer-controls">
                <span
                  id="composer-runtime-status"
                  class="composer-runtime-status"
                  role="status"
                  aria-live="polite"
                  hidden
                ></span>
                <label class="sr-only" for="composer-model-select">Model</label>
                <select
                  id="composer-model-select"
                  class="composer-model-select"
                  aria-label="Model"
                  disabled
                >
                  <option value="">Loading model...</option>
                </select>
                <button
                  id="send-button"
                  class="composer-action"
                  type="submit"
                  aria-label="Send message"
                  disabled
                >
                  ↑
                </button>
              </div>
            </div>
          </form>
        </section>
      </div>
      <section id="settings-panel" class="settings-panel" aria-label="Settings" hidden>
        <div class="settings-dialog">
          <header class="settings-header">
            <div>
              <h2>Settings</h2>
              <p>Provider, cache, and privacy controls</p>
            </div>
            <button id="settings-close-button" class="secondary-button" type="button">Close</button>
          </header>
          <div id="settings-error" class="error-banner" role="alert" hidden></div>
          <form id="settings-form" class="settings-form">
            <div class="settings-scroll">
              <section class="settings-app-info" aria-label="Application information">
                <h3>Application</h3>
                <dl>
                  <div>
                    <dt>Current session</dt>
                    <dd id="settings-session-label">No active session</dd>
                  </div>
                </dl>
              </section>
              <fieldset>
                <legend>LLM provider</legend>
                <label>
                  Provider
                  <select id="settings-llm-provider" name="llm_provider">
                    <option value="offline-test">offline-test</option>
                    <option value="local-openai">local-openai</option>
                    <option value="openai">openai</option>
                    <option value="anthropic">anthropic</option>
                    <option value="gemini">gemini</option>
                    <option value="litellm">litellm</option>
                  </select>
                </label>
                <label>
                  Model
                  <select id="settings-llm-model" name="llm_model">
                    <option value="">Check provider to load models</option>
                  </select>
                </label>
                <label data-provider-field="base-url">
                  Base URL
                  <input id="settings-llm-base-url" name="llm_base_url" type="url" />
                </label>
                <label data-provider-field="local-runtime">
                  Local runtime
                  <select id="settings-local-runtime" name="llm_local_runtime">
                    <option value="llama.cpp">llama.cpp</option>
                    <option value="ollama">ollama</option>
                    <option value="generic-openai">generic-openai</option>
                  </select>
                </label>
                <label data-provider-field="timeout">
                  Timeout seconds
                  <input id="settings-timeout" name="llm_timeout_seconds" type="number" min="1" max="300" step="0.5" />
                </label>
                <div
                  id="settings-credential-control"
                  class="settings-credential-control"
                  data-provider-field="credential"
                  hidden
                >
                  <label for="settings-provider-api-key">
                    API key
                    <input
                      id="settings-provider-api-key"
                      type="password"
                      maxlength="500"
                      autocomplete="off"
                      aria-describedby="settings-credential-status"
                      spellcheck="false"
                    />
                  </label>
                  <p id="settings-credential-status" role="status" aria-live="polite"></p>
                  <div class="settings-credential-actions">
                    <button
                      id="settings-credential-save-button"
                      class="secondary-button"
                      type="button"
                    >
                      Save API key
                    </button>
                    <button
                      id="settings-credential-remove-button"
                      class="secondary-button"
                      type="button"
                      hidden
                    >
                      Remove saved key
                    </button>
                  </div>
                </div>
              </fieldset>
              <fieldset>
                <legend>Embeddings and retrieval</legend>
                <label>
                  Embedding provider
                  <select id="settings-embedding-provider" name="embedding_provider">
                    <option value="disabled">disabled</option>
                    <option value="offline-test">offline-test</option>
                    <option value="local-openai">local-openai</option>
                    <option value="openai">openai</option>
                    <option value="gemini">gemini</option>
                    <option value="litellm">litellm</option>
                  </select>
                </label>
                <label>
                  Embedding model
                  <input id="settings-embedding-model" name="embedding_model" type="text" />
                </label>
                <label>
                  Retrieval top K
                  <input id="settings-retrieval-top-k" name="retrieval_top_k" type="number" min="1" max="50" />
                </label>
                <label>
                  Minimum score
                  <input id="settings-retrieval-min-score" name="retrieval_min_score" type="number" min="-1" max="1" step="0.01" />
                </label>
              </fieldset>
              <fieldset>
                <legend>Data and local resources</legend>
                <label>
                  Market cache TTL days
                  <input id="settings-market-ttl" name="market_data_cache_ttl_days" type="number" min="1" max="365" />
                </label>
                <label>
                  Filing cache TTL days
                  <input id="settings-filing-ttl" name="filing_cache_ttl_days" type="number" min="1" max="365" />
                </label>
                <label>
                  Background research limit
                  <input id="settings-background-limit" name="background_max_concurrent_research_runs" type="number" min="1" max="8" />
                </label>
              </fieldset>
              <div id="settings-agent-runtime-status" class="settings-status"></div>
              <div id="settings-web-research-status" class="settings-status"></div>
              <div id="settings-provider-status" class="settings-status"></div>
              <div id="settings-secret-note" class="settings-secret-note"></div>
            </div>
            <div class="settings-actions">
              <button id="settings-health-button" class="secondary-button" type="button">Check provider</button>
              <button id="settings-cache-clear-button" class="secondary-button" type="button">Clear cache</button>
              <button id="settings-reset-button" class="secondary-button" type="button">Reset overrides</button>
              <button id="settings-save-button" type="submit">Save</button>
            </div>
          </form>
        </div>
      </section>
    </main>
    <script src="/static/app.js?v=50" type="module"></script>
  </body>
</html>
